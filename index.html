<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Companion</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎻</text></svg>" />
  <style>
    :root {
      color-scheme: light;
      /* cool morning-fog stage: porcelain surfaces, slate ink, cobalt actions */
      --bg: #eef1f6;
      --card: #ffffff;
      --card-2: #e4e8f0;
      --ink: #1c2230;
      --muted: #6d7688;
      --line: #dfe3ec;
      --line-strong: #c7cfdd;
      --primary: #3056d3;
      --primary-deep: #2645ac;
      --good: #2e9e63;
      --off: #e08a1e;
      --bad: #d64545;
      --good-soft: #e2f3ea;
      --off-soft: #faeeda;
      --bad-soft: #fae4e4;
      --display: Futura, "Century Gothic", "Trebuchet MS", "Avenir Next", sans-serif;
      --ui: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --shadow: 0 1px 2px rgba(28, 34, 48, 0.06), 0 6px 20px rgba(28, 34, 48, 0.07);
    }
    * { margin: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      background:
        radial-gradient(80rem 36rem at 50% -16rem, #f8fafd, transparent),
        var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      min-height: 100vh;
    }
    button, select, input { font-family: var(--ui); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ---- header & tabs ---- */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      padding: 2rem 1rem 0.5rem;
    }
    h1 {
      font-family: var(--display);
      font-size: 1.05rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 600;
    }
    h1 span { color: var(--primary); }
    nav[role="tablist"] {
      display: flex;
      background: var(--card-2);
      border-radius: 999px;
      padding: 0.3rem;
      gap: 0.2rem;
    }
    .tab-btn {
      background: none;
      border: none;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0.55rem 1.2rem;
      transition: color 120ms, background 120ms;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn[aria-selected="true"] {
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    #status { color: var(--muted); font-size: 0.8rem; min-height: 1.2em; }

    /* ---- tab panels ---- */
    .tab-panel { display: none; padding: 1.2rem clamp(1rem, 4vw, 3rem) 3rem; max-width: 72rem; margin: 0 auto; }
    .tab-panel.active { display: block; }
    .column { width: min(32rem, 100%); margin: 0 auto; text-align: center; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1.4rem;
      box-shadow: var(--shadow);
    }

    /* ---- buttons ---- */
    button.ctl {
      font-size: 0.92rem;
      font-weight: 600;
      background: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 0.65rem 1.5rem;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(28, 34, 48, 0.06);
      transition: transform 100ms, box-shadow 100ms, background 120ms;
    }
    button.ctl:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    button.ctl:active { transform: translateY(0); }
    button.ctl.primary, button.ctl.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    button.ctl.primary:hover, button.ctl.active:hover { background: var(--primary-deep); }
    .tab-panel select, .tab-panel input[type="number"] {
      font-size: 0.88rem;
      background: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 0.5rem 0.9rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; align-items: center; }
    .row + .row { margin-top: 1rem; }
    .row label { color: var(--muted); font-size: 0.82rem; }
    #a4 { width: 4.6rem; text-align: center; }

    /* ---- tuner gauge ---- */
    #tuner { padding: 2.2rem 1.6rem 1.8rem; margin-bottom: 1.4rem; position: relative; }
    #gauge-wrap { position: relative; max-width: 24rem; margin: 0 auto; }
    #gauge-svg { width: 100%; display: block; }
    #needle-g { transform-origin: 150px 150px; transition: transform 100ms cubic-bezier(0.2, 0.6, 0.3, 1); }
    @media (prefers-reduced-motion: reduce) { #needle-g { transition: none; } }
    #note {
      position: absolute;
      left: 0; right: 0;
      top: 56%;
      font-family: var(--display);
      font-size: 3.4rem;
      font-weight: 500;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      transition: color 120ms;
      pointer-events: none;
    }
    #note[data-state="good"] { color: var(--good); }
    #note[data-state="off"] { color: var(--off); }
    #note[data-state="idle"] { color: var(--muted); }
    #cents { color: var(--muted); margin-top: 0.4rem; font-size: 1rem; min-height: 1.3em; }
    #freq { color: var(--muted); font-size: 0.8rem; min-height: 1.2em; margin-top: 0.15rem; }
    #second { color: var(--off); font-size: 0.85rem; min-height: 1.3em; margin-top: 0.25rem; }

    /* ---- record & analyze ---- */
    #notes-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      min-height: 2rem;
      margin: 1.2rem auto;
      max-width: 60rem;
    }
    .note-chip {
      background: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 1px 2px rgba(28, 34, 48, 0.05);
    }
    .note-chip[data-state="good"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
    .note-chip[data-state="off"] { background: var(--off-soft); border-color: var(--off); color: var(--off); }
    .note-chip[data-state="bad"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
    .note-chip.chord, .degree.chord { border-style: dashed; }

    #report { display: none; padding: 1.6rem; margin: 0 auto 1.5rem; text-align: left; }
    #report.visible { display: block; }
    #notes-details { margin-top: 0.8rem; }
    #notes-details summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0;
      user-select: none;
      list-style-position: inside;
    }
    #notes-details summary:hover { color: var(--ink); }
    #report-grid { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.6rem 0 0.4rem; }
    #chart-scroll {
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) var(--card-2);
      padding-bottom: 4px;
    }
    /* an always-visible drag bar under the graph */
    #chart-scroll::-webkit-scrollbar { height: 10px; }
    #chart-scroll::-webkit-scrollbar-track { background: var(--card-2); border-radius: 999px; }
    #chart-scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; }
    #chart-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    .degree {
      border: 1px solid var(--line-strong);
      background: var(--card);
      border-radius: 0.8rem;
      padding: 0.4rem 0.55rem;
      font-size: 0.8rem;
      text-align: center;
      min-width: 3.4rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .degree b { display: block; font-weight: 600; font-size: 0.98rem; }
    .degree[data-state="good"] { background: var(--good-soft); border-color: var(--good); }
    .degree[data-state="good"] b { color: var(--good); }
    .degree[data-state="off"] { background: var(--off-soft); border-color: var(--off); }
    .degree[data-state="off"] b { color: var(--off); }
    .degree[data-state="bad"] { background: var(--bad-soft); border-color: var(--bad); }
    .degree[data-state="bad"] b { color: var(--bad); }
    .degree[data-state="missed"] { opacity: 0.45; }
    .degree.peek { border-color: var(--ink); }
    .degree.clickable { cursor: pointer; transition: transform 100ms, box-shadow 100ms; }
    .degree.clickable:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .degree.playing { outline: 2px solid var(--primary); outline-offset: 1px; }
    #report-summary { color: var(--muted); font-size: 0.85rem; }
    #playback { margin-top: 1.1rem; border-top: 1px solid var(--line); padding-top: 1.1rem; }
    #pitch-chart { height: clamp(230px, 38vh, 320px); display: block; margin: 0 auto; }

    /* playback tools: one labeled row of friendly controls */
    #playback-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
      margin-top: 0.9rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    #playback-label { font-weight: 500; color: var(--ink); }
    #playback-speed {
      display: inline-flex;
      background: var(--card-2);
      border-radius: 999px;
      padding: 0.2rem;
      gap: 0.1rem;
    }
    #playback-speed button {
      border: none;
      background: none;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
      color: var(--muted);
    }
    #playback-speed button:hover { color: var(--ink); }
    #playback-speed button.active { background: var(--primary); color: #fff; }
    #playback-controls > button {
      font-size: 0.84rem;
      font-weight: 600;
      background: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 0.45rem 1rem;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(28, 34, 48, 0.05);
      transition: transform 100ms, background 120ms;
    }
    #playback-controls > button:hover { transform: translateY(-1px); }
    #playback-controls > button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    #ref-octave, #ref-interval {
      font-size: 0.82rem;
      background: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 0.4rem 0.7rem;
    }

    /* zoom inset: the selected note in cents detail, below the overview */
    #note-zoom {
      margin-top: 1rem;
      border-top: 1px dashed var(--line-strong);
      padding-top: 0.8rem;
    }
    #zoom-head { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.4rem; }
    #zoom-play {
      width: 2.4rem; height: 2.4rem;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      transition: transform 100ms, background 120ms;
    }
    #zoom-play:hover { background: var(--primary-deep); transform: scale(1.05); }
    #zoom-label { color: var(--ink); font-weight: 500; font-size: 0.85rem; }
    #zoom-hint { color: var(--muted); font-size: 0.75rem; }
    #note-chart { width: 100%; height: 170px; display: block; }

    /* ---- library ---- */
    #library { margin: 0 auto; text-align: center; width: min(34rem, 100%); }
    #library-empty { color: var(--muted); font-size: 0.85rem; }
    #library-list { list-style: none; padding: 0; display: grid; gap: 0.5rem; }
    .lib-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 0.7rem 1rem;
      box-shadow: 0 1px 2px rgba(28, 34, 48, 0.05);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }
    .lib-item .lib-meta { color: var(--muted); text-align: left; }
    .lib-item .lib-meta b { color: var(--ink); font-weight: 600; display: block; }
    .lib-item .lib-actions { display: flex; gap: 0.4rem; }
    .lib-item button {
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      cursor: pointer;
    }
    .lib-item button:hover { border-color: var(--primary); color: var(--primary); }
    .lib-item button.danger:hover { border-color: var(--bad); color: var(--bad); }

    /* ---- metronome ---- */
    #metro-card { padding: 2.4rem 2rem 2rem; }
    #bpm-display {
      font-family: var(--display);
      font-size: 6rem;
      font-weight: 500;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    #tempo-name { color: var(--primary); font-size: 1rem; margin-top: 0.4rem; font-weight: 500; letter-spacing: 0.06em; }
    #bpm-slider { width: 100%; margin: 1.7rem 0 1.2rem; accent-color: var(--primary); }
    #timer-display { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; min-width: 3.2rem; }
    #beat-dots { display: flex; gap: 0.9rem; justify-content: center; align-items: center; margin: 1.4rem 0 1.6rem; min-height: 1.2rem; }
    .beat-dot {
      width: 0.8rem; height: 0.8rem;
      border-radius: 50%;
      border: 1.5px solid var(--line-strong);
      background: var(--card);
      transition: transform 80ms, background 80ms;
    }
    .beat-dot.downbeat { width: 1rem; height: 1rem; border-color: var(--primary); }
    .beat-dot.on { background: var(--primary); border-color: var(--primary); transform: scale(1.3); }
    @media (prefers-reduced-motion: reduce) {
      .beat-dot { transition: none; }
      .beat-dot.on { transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Music <span>·</span> Companion</h1>
    <nav role="tablist" aria-label="Sections">
      <button class="tab-btn" role="tab" data-tab="tuner" aria-selected="true">Tuner</button>
      <button class="tab-btn" role="tab" data-tab="analyze" aria-selected="false">Record &amp; analyze</button>
      <button class="tab-btn" role="tab" data-tab="library" aria-selected="false">Library</button>
      <button class="tab-btn" role="tab" data-tab="metronome" aria-selected="false">Metronome</button>
    </nav>
    <div id="status"></div>
  </header>

  <!-- ================= tuner ================= -->
  <section id="tab-tuner" class="tab-panel active" role="tabpanel">
    <div class="column">
      <div id="tuner" class="card">
        <div id="gauge-wrap">
          <svg id="gauge-svg" viewBox="0 0 300 170" aria-hidden="true"></svg>
          <div id="note" data-state="idle">–</div>
        </div>
        <div id="cents">press start</div>
        <div id="freq"></div>
        <div id="second"></div>
      </div>
      <div class="row">
        <button id="listen" class="ctl primary">Start tuner</button>
      </div>
      <div class="row">
        <label for="drone-note">drone</label>
        <select id="drone-note" aria-label="Drone note"></select>
        <select id="drone-octave" aria-label="Drone octave">
          <option value="1">oct 1</option>
          <option value="2" selected>oct 2</option>
          <option value="3">oct 3</option>
          <option value="4">oct 4</option>
        </select>
        <button id="drone-toggle" class="ctl">Play</button>
      </div>
      <div class="row" id="calibration">
        <label for="a4">A4 =</label>
        <input id="a4" type="number" min="400" max="450" step="1" value="440" />
        <label>Hz</label>
      </div>
    </div>
  </section>

  <!-- ================= record & analyze ================= -->
  <section id="tab-analyze" class="tab-panel" role="tabpanel">
    <div class="column">
      <div class="row">
        <button id="start" class="ctl primary">Record</button>
      </div>
      <div class="row" id="save-bar" hidden>
        <button id="save-rec" class="ctl primary">Save to library</button>
        <button id="discard-rec" class="ctl">Discard</button>
      </div>
    </div>
    <div id="notes-row"></div>
    <div id="report" class="card">
      <div id="report-summary"></div>
      <details id="notes-details">
        <summary id="notes-summary">notes</summary>
        <div id="report-grid"></div>
      </details>
      <div id="playback" hidden>
        <div id="chart-scroll"><canvas id="pitch-chart"></canvas></div>
        <div id="playback-controls">
          <span id="playback-label"></span>
          <span id="playback-speed">
            <button data-speed="1" class="active">1×</button>
            <button data-speed="0.75">¾×</button>
            <button data-speed="0.5">½×</button>
            <button data-speed="0.25">¼×</button>
          </span>
          <button id="note-drone" hidden>Hold note as drone</button>
          <button id="ref-drone" hidden></button>
          <select id="ref-interval" hidden aria-label="Reference drone interval">
            <option value="unison" selected>same note</option>
            <option value="fifth-up">fifth up</option>
            <option value="fifth-down">fifth down</option>
          </select>
          <select id="ref-octave" hidden aria-label="Reference drone octave">
            <option value="-4">4 octaves down</option>
            <option value="-3">3 octaves down</option>
            <option value="-2">2 octaves down</option>
            <option value="-1">octave down</option>
            <option value="0" selected>same octave</option>
            <option value="1">octave up</option>
            <option value="2">2 octaves up</option>
            <option value="3">3 octaves up</option>
            <option value="4">4 octaves up</option>
          </select>
          <button id="compare" hidden></button>
        </div>
        <div id="note-zoom" hidden>
          <div id="zoom-head">
            <button id="zoom-play" aria-label="Play or pause this section">▶</button>
            <span id="zoom-label"></span>
            <span id="zoom-hint">drag on the graph to move the playhead</span>
          </div>
          <canvas id="note-chart"></canvas>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= library ================= -->
  <section id="tab-library" class="tab-panel" role="tabpanel">
    <div id="library">
      <ul id="library-list"></ul>
      <div id="library-empty">Recordings you save appear here.</div>
    </div>
  </section>

  <!-- ================= metronome ================= -->
  <section id="tab-metronome" class="tab-panel" role="tabpanel">
    <div class="column">
      <div id="metro-card" class="card">
        <div id="bpm-display">80</div>
        <div id="tempo-name">Andante</div>
        <input id="bpm-slider" type="range" min="20" max="260" value="80" aria-label="Beats per minute" />
        <div class="row">
          <button id="bpm-down" class="ctl" aria-label="Slower">−</button>
          <button id="bpm-up" class="ctl" aria-label="Faster">+</button>
          <button id="tap-tempo" class="ctl">Tap tempo</button>
          <select id="beats-per-bar" aria-label="Beats per bar">
            <option value="2">2 beats</option>
            <option value="3">3 beats</option>
            <option value="4" selected>4 beats</option>
            <option value="5">5 beats</option>
            <option value="6">6 beats</option>
            <option value="7">7 beats</option>
          </select>
        </div>
        <div class="row">
          <select id="subdivision" aria-label="Subdivision">
            <option value="quarter" selected>♩ quarters</option>
            <option value="eighth">♫ eighths</option>
            <option value="triplet">♪♪♪ triplets</option>
            <option value="sixteenth">♬ sixteenths</option>
            <option value="shuffle">♫ shuffle</option>
          </select>
          <button id="accent-toggle" class="ctl active">Accent beat 1</button>
          <select id="timer-mins" aria-label="Practice timer">
            <option value="0" selected>no timer</option>
            <option value="1">1 min</option>
            <option value="2">2 min</option>
            <option value="5">5 min</option>
            <option value="10">10 min</option>
            <option value="20">20 min</option>
          </select>
          <span id="timer-display"></span>
        </div>
        <div id="beat-dots"></div>
        <button id="metro-toggle" class="ctl primary">Start</button>
      </div>
    </div>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
