<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the reader sees</title>
<!--
  Everything the page reader found, drawn on top of the page it found it on.

  The numbers in the benchmarks say 428 noteheads where there are about 320, and
  a number cannot say WHICH eighty are wrong — whether they are slurs read as
  notes, fingerings, the same head found twice, or real notes missed. This is for
  looking, which is the only way to answer that.

  Drop a photograph or a PDF page on it. Nothing is uploaded; it runs the shipped
  reader in the browser and draws what came back.

  MARKING MODE turns the looking into ground truth. Click a ring that is not a
  note, click bare paper where a note was missed, and save — what comes out is
  the set of real notehead positions on that page, which tools/truth-check.mjs
  then scores any run of the reader against. Marks are kept in localStorage per
  file so a reload does not cost the work.

    npm run dev        (port 5199)
    open http://localhost:5199/tools/reader-look.html
-->
<style>
  :root {
    --ground: #14122b;
    --panel: #1e1b41;
    --ink: #eceafb;
    --muted: #9d97c4;
    --rule: #322d63;
    --head: #58e0a8;
    --head-line: #0b2a1e;
    --bar: #ff9f4d;
    --stave: #6ea8ff;
    --bad: #ff6b8a;
    --add: #c9a4ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
  }
  header {
    padding: 1.1rem 1.4rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    gap: 1rem 1.6rem;
    align-items: center;
    position: sticky;
    top: 0;
    background: color-mix(in srgb, var(--ground) 94%, transparent);
    backdrop-filter: blur(8px);
    z-index: 5;
  }
  h1 { font-size: 1.05rem; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .spacer { flex: 1; }
  label.toggle {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.85rem; color: var(--muted); cursor: pointer; user-select: none;
  }
  label.toggle input { accent-color: var(--head); }
  input[type=file] { font: inherit; color: var(--muted); max-width: 15rem; }
  #counts {
    font-family: var(--mono); font-size: 0.8rem; color: var(--muted);
    display: flex; gap: 1.1rem; flex-wrap: wrap;
  }
  #counts b { color: var(--ink); font-weight: 600; }
  main { padding: 1.4rem; }
  #stage { position: relative; display: inline-block; max-width: 100%; }
  #stage img { display: block; max-width: 100%; height: auto; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #note .big { font-size: 1.5rem; color: var(--head); letter-spacing: 0.01em; }
  select { font: inherit; font-size: 0.85rem; background: var(--panel); color: var(--ink);
           border: 1px solid var(--rule); border-radius: 5px; padding: 0.1rem 0.3rem; }
  #note {
    position: fixed; bottom: 1rem; left: 1rem; right: 1rem;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 9px;
    padding: 0.7rem 0.9rem; font-family: var(--mono); font-size: 0.82rem;
    display: none; max-width: 42rem;
  }
  .hint { color: var(--muted); max-width: 60ch; }
  .swatch { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 2px; vertical-align: -1px; }
  button {
    font: inherit; font-size: 0.85rem; background: var(--panel); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 5px; padding: 0.2rem 0.6rem; cursor: pointer;
  }
  button:hover { border-color: var(--head); }
  button[disabled] { opacity: 0.45; cursor: default; border-color: var(--rule); }
  label.toggle.arm { color: var(--add); font-weight: 600; }
  #marking { display: none; gap: 0.6rem; align-items: center; }
  #marking.on { display: flex; }
  #tally { font-family: var(--mono); font-size: 0.8rem; color: var(--add); }
</style>
</head>
<body>

<header>
  <h1>What the reader sees</h1>
  <input type="file" id="file" accept="image/*,.pdf">
  <label class="toggle"><input type="checkbox" id="showHeads" checked> <span class="swatch" style="background:var(--head)"></span> noteheads</label>
  <label class="toggle"><input type="checkbox" id="showBars" checked> <span class="swatch" style="background:var(--bar)"></span> barlines</label>
  <label class="toggle"><input type="checkbox" id="showStaves" checked> <span class="swatch" style="background:var(--stave)"></span> staves &amp; clefs</label>
  <label class="toggle"><input type="checkbox" id="showSteps"> numbers</label>
  <label class="toggle"><input type="checkbox" id="showZone" checked> <span class="swatch" style="background:var(--bad)"></span> clef zone</label>
  <label class="toggle">clef
    <select id="forceClef">
      <option value="">as read</option>
      <option value="bass">bass</option>
      <option value="tenor">tenor</option>
      <option value="treble">treble</option>
    </select>
  </label>
  <label class="toggle">key
    <select id="forceKey">
      <option value="0">none</option>
      <option value="1">1 sharp (G)</option>
      <option value="2">2 sharps (D)</option>
      <option value="3">3 sharps (A)</option>
      <option value="-1">1 flat (F)</option>
      <option value="-2">2 flats (B♭)</option>
      <option value="-3">3 flats (E♭)</option>
    </select>
  </label>
  <label class="toggle arm"><input type="checkbox" id="markOn"> marking mode</label>
  <div class="spacer"></div>
  <div id="counts"></div>
  <div id="marking">
    <span id="tally"></span>
    <button id="undo" disabled>undo</button>
    <button id="clear">clear</button>
    <button id="save">save truth</button>
  </div>
</header>

<main>
  <p class="hint" id="hint">
    Drop in the photograph. It runs the shipped page reader — the same code the app
    uses — and draws every notehead, barline and stave it found, so the count can be
    checked by eye rather than believed. Nothing leaves the browser.
  </p>
  <div id="stage" hidden>
    <img id="page" alt="the page being read">
    <svg id="overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
  </div>
</main>

<div id="note"></div>

<script type="module">
import { readPage, notesInOrder } from '/src/analysis/scan-read.js';
import { pitchOf } from '/src/analysis/scan-notes.js';
import { keyFromCount, NO_KEY } from '/src/analysis/scan-key.js';
import { midiToName } from '/src/analysis/note-utils.js';

const els = {
  file: document.querySelector('#file'),
  page: document.querySelector('#page'),
  overlay: document.querySelector('#overlay'),
  stage: document.querySelector('#stage'),
  counts: document.querySelector('#counts'),
  note: document.querySelector('#note'),
  hint: document.querySelector('#hint'),
};
const toggles = {
  heads: document.querySelector('#showHeads'),
  bars: document.querySelector('#showBars'),
  staves: document.querySelector('#showStaves'),
  steps: document.querySelector('#showSteps'),
  zone: document.querySelector('#showZone'),
};
const forceClef = document.querySelector('#forceClef');
const forceKey = document.querySelector('#forceKey');
const marking = {
  on: document.querySelector('#markOn'),
  bar: document.querySelector('#marking'),
  tally: document.querySelector('#tally'),
  undo: document.querySelector('#undo'),
  clear: document.querySelector('#clear'),
  save: document.querySelector('#save'),
};

// MARKING — what is actually on the page, said by somebody who can see it.
//
// Every filter proposed for the false noteheads has been argued about and two
// were nearly shipped on a hunch; one of them, applied without measurement,
// collapsed a page from 477 heads to 190. The reason that could happen is that
// there was no way to tell a filter that removed junk from a filter that removed
// the music: the count says 417 against about 320 and a count cannot say WHICH
// ninety-seven, so every candidate fix was graded on synthetic pages that have
// no pencil, no fingerings and no heading on them — exactly the marks that
// matter.
//
// This is the missing half. The reader's own candidates are drawn as usual;
// clicking one says "that is not a note", and clicking bare paper says "there is
// a note here you missed". What comes out is the set of real notehead positions
// on this page, which is ground truth, and every filter after it is arithmetic.
//
// STORED AS POSITIONS, NOT INDICES, and that is the whole point.
//
// An index into "the notes the reader found" is a label about a particular
// build of the reader, and is void the moment the detector changes — which is
// the very thing the labels exist to allow. A position on the page is a fact
// about the PAGE. So a rejection is remembered as where it was, and matched
// back by proximity on any later run, exactly the way tools/head-audit.mjs
// matches to what it drew.
let marks = { rejected: [], added: [] };
let history = [];
let markKey = null;   // which file these marks belong to

// Half a staff space. Wide enough that a detector that moves a head slightly
// still meets its old label, tight enough that it cannot meet its neighbour's:
// noteheads on this page are about two spaces apart at their closest.
const NEAR = 0.5;

// The staff space the STAVES report, not the one the page-wide fit does.
//
// read.space is the estimate the comb was built from and comes out about a
// sixth low on a real page — 10px where every stave then measures 12.1 — so
// half of it is not half a space, it is 0.41 of one, and the tolerance errs
// toward calling a note both invented and missed. The median of the staves is
// the number the reader itself went on to use. tools/truth-check.mjs computes
// it the same way, and the two MUST agree or a label means one thing when it is
// made and another when it is scored.
function spaceOf(read, height) {
  const spaces = (read.staves ?? []).map((s) => s.space * height).sort((a, b) => a - b);
  return spaces.length ? spaces[Math.floor((spaces.length - 1) / 2)] : (read.space ?? 0.012) * height;
}

function nearestMark(list, x, y, space) {
  let best = -1;
  let gap = Infinity;
  for (const [i, m] of list.entries()) {
    const d = Math.hypot((m.x - x) * last.width, (m.y - y) * last.height);
    if (d < space * NEAR && d < gap) { gap = d; best = i; }
  }
  return best;
}

function isRejected(note, space) {
  return nearestMark(marks.rejected, note.x, note.y, space) >= 0;
}

// The undo stack takes a copy of the marks BEFORE the change, which is what
// undo means. Storing them is a separate job and belongs after the change —
// doing both here wrote the previous state to localStorage every time, so a
// reload lost the last mark made and nothing on the screen said so.
function remember() {
  history.push(JSON.stringify(marks));
  if (history.length > 400) history.shift();
  marking.undo.disabled = false;
}

// The count on screen has to be arithmetic that adds up, and rejections are not
// rings: one mark strikes EVERY candidate standing on it, so a duplicate pair
// goes to a single click. Reporting marks.rejected.length here printed
// "50 real = 52 found − 1 false" on exactly the page this tool exists for.
function tally() {
  if (!last) return;
  const space = spaceOf(last.read, last.height);
  const found = notesInOrder(last.read);
  const kept = found.filter((n) => !isRejected(n, space)).length;
  const struck = found.length - kept;
  marking.tally.textContent = `${kept + marks.added.length} real`
    + ` = ${found.length} found − ${struck} false + ${marks.added.length} missed`
    + (struck > marks.rejected.length ? ` (${marks.rejected.length} marks)` : '');
}

// The clef the reader read is wrong on a good half of a real page, and the note
// names all hang off it. Rather than show names that are confidently a sixth
// out, the clef can be SAID — which is also how a page gets checked by somebody
// who can see what clef it is at a glance.
function clefFor(staffClef) {
  return forceClef.value || staffClef;
}
function keyNow() {
  const n = Number(forceKey.value) || 0;
  if (!n) return NO_KEY;
  return keyFromCount(Math.abs(n), n > 0 ? 'sharp' : 'flat') ?? NO_KEY;
}

let last = null;

// A PDF page is turned into a picture first, using the reader's own pdf.js so
// this sees exactly the pixels the app would.
async function toImage(file) {
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {
    return createImageBitmap(file);
  }
  const pdfjs = await import('pdfjs-dist');
  pdfjs.GlobalWorkerOptions.workerSrc = new URL(
    'pdfjs-dist/build/pdf.worker.mjs', import.meta.url,
  ).href;
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const page = await doc.getPage(1);
  const scale = 1800 / page.getViewport({ scale: 1 }).width;
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return canvas;
}

function svgEl(name, attrs) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

function draw() {
  if (!last) return;
  const { read, width, height } = last;
  const svg = els.overlay;
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.replaceChildren();

  const space = spaceOf(read, height);

  // Bare paper, listening. Appended first so every ring and marker sits on top
  // of it and gets the click instead.
  if (marking.on.checked) {
    const sheet = svgEl('rect', { x: 0, y: 0, width, height, fill: 'transparent' });
    sheet.style.cursor = 'crosshair';
    sheet.addEventListener('click', (e) => {
      const at = pointIn(e);
      if (!at) return;
      const x = at.x / width;
      const y = at.y / height;
      // One note, one mark. A page marked by hand collects double-clicks, and
      // three crosses on one notehead came back from the first real page as
      // three missed notes — a recall figure nearly half of which was a slip of
      // the mouse. The tolerance is the same half space everything else uses, so
      // what cannot be told apart when scoring cannot be entered twice either.
      if (nearestMark(marks.added, x, y, space) >= 0) {
        els.hint.textContent = 'There is already a mark there.';
        return;
      }
      if (notesInOrder(read).some((n) => !isRejected(n, space)
        && Math.hypot((n.x - x) * width, (n.y - y) * height) < space * NEAR)) {
        els.hint.textContent = 'The reader already found that one — it is not missed.';
        return;
      }
      remember();
      marks.added.push({ x, y });
      draw();
    });
    svg.append(sheet);
  }

  for (const [i, staff] of (read.staves ?? []).entries()) {
    if (toggles.staves.checked) {
      // The five lines as the reader tracked them — bent, because the page is.
      for (const line of staff.lines) {
        const step = width / (line.length - 1);
        const d = line.map((y, k) => `${k ? 'L' : 'M'}${(k * step).toFixed(1)},${(y * height).toFixed(1)}`).join(' ');
        svg.append(svgEl('path', { d, fill: 'none', stroke: 'var(--stave)', 'stroke-width': 1, opacity: 0.55 }));
      }
      const label = svgEl('text', {
        x: 6, y: (staff.lines[0][0] * height) - space * 1.2,
        fill: staff.clef ? 'var(--stave)' : 'var(--bad)',
        'font-size': Math.max(11, space * 1.5), 'font-family': 'ui-monospace, monospace',
      });
      const shown = clefFor(staff.clef);
      label.textContent = `${i + 1}: ${shown ?? 'no clef'}`
        + (forceClef.value ? ' (set)'
          : staff.clef ? ` ${(staff.clefConfidence ?? 0).toFixed(2)}` : '');
      svg.append(label);
    }
    // The band the clef was actually read from. Drawn because four attempts at
    // correcting the clef were reasoned about and measured, and none of them
    // looked at where the measurement was being taken.
    if (toggles.zone.checked && staff.clefZone) {
      const zx = staff.clefZone.x * width;
      const zw = staff.clefZone.w * width;
      const zTop = staff.lines[0][0] * height - space * 3;
      svg.append(svgEl('rect', {
        x: zx, y: zTop, width: zw, height: space * 10,
        fill: 'none', stroke: 'var(--bad)', 'stroke-width': 1.5,
        'stroke-dasharray': '4 3', opacity: 0.9,
      }));
    }
    if (toggles.bars.checked) {
      for (const x of staff.bars ?? []) {
        const top = staff.lines[0][Math.min(staff.lines[0].length - 1, Math.round(x * (staff.lines[0].length - 1)))] * height;
        const bottom = staff.lines[4][Math.min(staff.lines[4].length - 1, Math.round(x * (staff.lines[4].length - 1)))] * height;
        svg.append(svgEl('line', {
          x1: x * width, x2: x * width, y1: top - space, y2: bottom + space,
          stroke: 'var(--bar)', 'stroke-width': 2.5, opacity: 0.85,
        }));
      }
    }
  }

  if (toggles.heads.checked) {
    for (const [i, note] of notesInOrder(read).entries()) {
      const cx = note.x * width;
      const cy = note.y * height;
      const struck = isRejected(note, space);
      const dot = svgEl('circle', {
        cx, cy, r: space * 0.62,
        fill: marking.on.checked ? 'rgba(0,0,0,0.01)' : 'none',
        stroke: struck ? 'var(--bad)' : 'var(--head)',
        'stroke-width': 1.8,
        'stroke-dasharray': struck ? '3 2' : 'none',
        opacity: struck ? 0.95 : 0.9,
      });
      dot.style.cursor = 'pointer';
      const clef = clefFor(note.clef);
      // WHAT THE READER SAYS, NOT WHAT THIS PAGE CAN WORK OUT.
      //
      // This recomputed the pitch from the step, a clef and the KEY DROPDOWN
      // above — and so it threw away three things the reader now knows and this
      // page did not ask for: the key signature it read off the paper, the
      // ACCIDENTAL standing in front of this very note, and the fact that an
      // accidental holds for the rest of its bar. A note with a sharp beside it
      // was named as if the sharp were not there, which is the one case where
      // being able to see the sharp makes the answer obviously wrong.
      //
      // notesInOrder already applies all three and reports `midi`. So that is
      // used wherever it exists, and the manual route is the fallback for a page
      // whose clef or key the reader could not read — which is what the
      // dropdowns are for.
      const own = Number.isFinite(note.midi) ? { midi: note.midi } : null;
      const pitch = own ?? pitchOf(note.step, clef, keyNow());
      const fromReader = !!own;
      // In marking mode a ring is a claim to agree or disagree with, and
      // clicking it disagrees. The note panel is for reading, and reading is
      // what the other mode is for.
      if (marking.on.checked) {
        dot.addEventListener('click', (e) => {
          e.stopPropagation();
          remember();
          const at = nearestMark(marks.rejected, note.x, note.y, space);
          if (at >= 0) marks.rejected.splice(at, 1);
          else marks.rejected.push({ x: note.x, y: note.y });
          draw();
        });
        svg.append(dot);
        continue;
      }
      dot.addEventListener('click', () => {
        els.note.style.display = 'block';
        const name = pitch ? midiToName(pitch.midi) : null;
        const value = note.beats === 4 ? 'semibreve'
          : note.beats === 2 ? 'minim'
          : note.beats === 1 ? 'crotchet'
          : note.beats === 0.5 ? 'quaver'
          : note.beats === 0.25 ? 'semiquaver'
          : note.beats === 0.125 ? 'demisemiquaver'
          : note.beats ? `${note.beats} beats` : 'unread';
        // What ALTERED it, said plainly, because a note name on its own does not
        // tell you whether the reader saw the sharp or merely assumed the key.
        const acc = note.accidental
          ? `<br>a ${note.accidental.kind} stands in front of it — read off the page`
          : note.alteredBy === 'carried'
            ? '<br>an accidental earlier in this bar still holds here'
            : note.alteredBy === 'key'
              ? '<br>altered by the key signature'
              : '';
        els.note.innerHTML = name
          ? `<b class="big">${name}</b> · ${value}`
            + `<br>note ${i + 1} of ${notesInOrder(read).length} · system ${note.staff + 1}`
            + ` · bar ${note.bar + 1} · step ${note.step}`
            + acc
            + (fromReader ? '' : '<br>named from the dropdowns above — the reader could not')
            + `<br>read in ${clef} clef`
            + (forceClef.value ? ' (you set this)'
              : ` at ${(note.clefConfidence ?? 0).toFixed(2)} confidence — set the clef above if that is wrong`)
          : `<b class="big">no name</b><br>note ${i + 1} · system ${note.staff + 1}`
            + ` · step ${note.step}<br>the clef on this system could not be read,`
            + ' and a step without a clef is not a note. Set it above.';
      });
      svg.append(dot);
      if (toggles.steps.checked) {
        const t = svgEl('text', {
          x: cx + space * 0.8, y: cy - space * 0.6,
          fill: 'var(--head)', 'font-size': Math.max(8, space * 0.9),
          'font-family': 'ui-monospace, monospace', opacity: 0.85,
        });
        t.textContent = String(i + 1);
        svg.append(t);
      }
    }
  }

  // Notes the reader never offered. Drawn as a cross so they cannot be mistaken
  // for a ring at a glance — a missed note and a found one are opposite
  // findings and the picture has to say which is which without being read.
  for (const m of marks.added) {
    const cx = m.x * width;
    const cy = m.y * height;
    const r = space * 0.55;
    const cross = svgEl('path', {
      d: `M${cx - r},${cy - r}L${cx + r},${cy + r}M${cx + r},${cy - r}L${cx - r},${cy + r}`,
      stroke: 'var(--add)', 'stroke-width': 2.2, fill: 'none', opacity: 0.95,
    });
    cross.style.cursor = 'pointer';
    if (marking.on.checked) {
      cross.addEventListener('click', (e) => {
        e.stopPropagation();
        remember();
        marks.added.splice(marks.added.indexOf(m), 1);
        draw();
      });
    }
    svg.append(cross);
  }

  tally();
  // Whatever is on the screen is what is stored. One place, after every change,
  // rather than at each of the four that make one.
  if (markKey) localStorage.setItem(markKey, JSON.stringify(marks));
}

// A click on the overlay, in the overlay's own coordinates. The image is shown
// at whatever width the window allows, so screen pixels are not page pixels and
// the browser's own transform is the only honest way back.
function pointIn(event) {
  const svg = els.overlay;
  const ctm = svg.getScreenCTM();
  if (!ctm) return null;
  const p = svg.createSVGPoint();
  p.x = event.clientX;
  p.y = event.clientY;
  return p.matrixTransform(ctm.inverse());
}

for (const t of Object.values(toggles)) t.addEventListener('change', draw);
forceClef.addEventListener('change', draw);
forceKey.addEventListener('change', draw);

marking.on.addEventListener('change', () => {
  marking.bar.classList.toggle('on', marking.on.checked);
  els.note.style.display = 'none';
  els.hint.textContent = marking.on.checked
    ? 'Click a ring that is not a note. Click bare paper where a note was missed.'
      + ' A click strikes every ring standing on that spot, so if the reader drew'
      + ' two on one notehead, reject it and then click the notehead back in.'
      + ' Z undoes. Save when the page is right — it is remembered as you go.'
    : 'Click any ring to see what the reader thinks that note is.';
  draw();
});

marking.undo.addEventListener('click', () => {
  const was = history.pop();
  if (!was) return;
  marks = JSON.parse(was);
  marking.undo.disabled = history.length === 0;
  draw();
});

marking.clear.addEventListener('click', () => {
  if (!confirm('Throw away every mark on this page?')) return;
  remember();
  marks = { rejected: [], added: [] };
  draw();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'z' && marking.on.checked && !e.metaKey && !e.ctrlKey) marking.undo.click();
});

// SAVED AS THE ANSWER, NOT AS THE WORKING.
//
// What goes in the file is the set of real notehead positions — the rings that
// survived plus the crosses that were added — because that is a fact about the
// page and stays true however the reader changes. The rejections are kept
// alongside it so the marking can be picked up again, but nothing downstream
// reads them: a harness scores a run by matching its detections against
// `notes`, which is the same shape tools/head-audit.mjs already scores against.
marking.save.addEventListener('click', () => {
  if (!last) return;
  const space = spaceOf(last.read, last.height);
  const kept = notesInOrder(last.read)
    .filter((n) => !isRejected(n, space))
    .map((n) => ({ x: +n.x.toFixed(5), y: +n.y.toFixed(5) }));
  const truth = {
    source: last.name,
    // Normalised, so the file does not silently assume a working width.
    width: last.width,
    height: last.height,
    space: +(last.read.space ?? 0).toFixed(6),
    marked: new Date().toISOString().slice(0, 10),
    notes: [...kept, ...marks.added.map((m) => ({ x: +m.x.toFixed(5), y: +m.y.toFixed(5) }))],
    rejected: marks.rejected.map((m) => ({ x: +m.x.toFixed(5), y: +m.y.toFixed(5) })),
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(truth, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `${last.name.replace(/\.[^.]+$/, '')}.truth.json`;
  a.click();
  URL.revokeObjectURL(url);
});

// Dropped as well as picked, because the instructions above say "drop in the
// photograph" and a page whose copy promises something the page cannot do is
// worse than one that never offered.
document.addEventListener('dragover', (e) => { e.preventDefault(); document.body.style.outline = '2px dashed var(--head)'; });
document.addEventListener('dragleave', () => { document.body.style.outline = ''; });
document.addEventListener('drop', (e) => {
  e.preventDefault();
  document.body.style.outline = '';
  const file = e.dataTransfer?.files?.[0];
  if (file) load(file);
});

els.file.addEventListener('change', () => {
  const file = els.file.files?.[0];
  if (file) load(file);
});

async function load(file) {
  els.hint.textContent = 'reading…';
  const source = await toImage(file);
  const naturalWidth = source.width;
  const naturalHeight = source.height;

  // Drawn at the reader's own working width, so what is measured is what is shown.
  const canvas = document.createElement('canvas');
  const W = Math.min(1400, naturalWidth);
  canvas.width = W;
  canvas.height = Math.round(naturalHeight * (W / naturalWidth));
  canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
  els.page.src = canvas.toDataURL('image/png');

  let read = null;
  try {
    read = readPage(canvas, canvas.width, canvas.height);
  } catch (err) {
    els.hint.textContent = `the reader threw: ${err.message}`;
    return;
  }
  if (!read) {
    els.hint.textContent = 'the reader found no stave at all on this page.';
    return;
  }

  last = { read, width: canvas.width, height: canvas.height, name: file.name };

  // Marking a page takes a while and a reload should not cost it. Keyed by name
  // and size rather than by name alone, so a corrected export of the same piece
  // does not inherit marks made against the old one.
  markKey = `reader-look:marks:${file.name}:${file.size}`;
  history = [];
  marking.undo.disabled = true;
  try {
    marks = JSON.parse(localStorage.getItem(markKey)) ?? { rejected: [], added: [] };
  } catch { marks = { rejected: [], added: [] }; }
  marks.rejected ??= [];
  marks.added ??= [];

  const notes = notesInOrder(read);
  const clefs = read.staves.map((s) => s.clef);
  const named = clefs.filter(Boolean).length;
  els.counts.innerHTML = `
    <span><b>${read.staves.length}</b> staves</span>
    <span><b>${notes.length}</b> noteheads</span>
    <span><b>${read.staves.reduce((a, s) => a + (s.bars?.length ?? 0), 0)}</b> barlines</span>
    <span><b>${named}/${clefs.length}</b> clefs read</span>
    <span>space <b>${(read.space * canvas.height).toFixed(1)}</b>px</span>`;
  els.hint.textContent = marking.on.checked
    ? 'Click a ring that is not a note. Click bare paper where a note was missed.'
      + ' A click strikes every ring standing on that spot, so if the reader drew'
      + ' two on one notehead, reject it and then click the notehead back in.'
      + ' Z undoes. Save when the page is right — it is remembered as you go.'
    : 'Click any ring to see what the reader thinks that note is.';
  els.stage.hidden = false;
  draw();
}
</script>
</body>
</html>
