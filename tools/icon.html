<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>icon source</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=block" rel="stylesheet" />
<!--
  The app's icons and share image, drawn rather than stored, so a theme change
  is a re-render instead of a hunt for whatever tool made the last set. The
  cobalt icons this replaced outlived their theme by a whole redesign and
  nobody noticed until the app looked like a different product on the home
  screen than it did once opened.

  Render with tools/build-icons.sh — it screenshots each variant below.
    ?v=icon      512 full-bleed, the normal icon
    ?v=maskable  512 with Android's 20% safe-zone padding
    ?v=og        1200x630 link preview
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body { display: grid; place-items: center; overflow: hidden; }

  .tile {
    background: linear-gradient(135deg, #7c5cff, #4cb8ff);
    display: grid;
    place-items: center;
    color: #fff;   /* the mark paints in currentColor; splash overrides it */
  }
  /* Duet spans about 77% of its own viewBox once the stroke is counted, which
     is a shade large for a tile — art at roughly two thirds of the square is
     what the icons beside it on a home screen do. */
  body[data-v="icon"] .gauge { transform: scale(0.86); }
  /* Android crops to a circle inscribed in the square, so the mark has to sit
     inside the inner 80% — a radius of 120 — or its edges are cut on a Pixel.
     The arcs' endpoints are the far corners of the shape and land at 105 once
     the tile scale above is applied, so the icon already clears it; the further
     15% here is margin against the phones that crop harder than a circle. */
  body[data-v="maskable"] .gauge { transform: scale(0.73); }

  /* The launch screen is not a billboard — it is the app's first frame drawn a
     moment early, so it wears the app's own background and shows the mark at
     the size it sits at in the header, not a logo blown up to fill a phone. */
  body[data-v="splash"] { background: #eeebfa; }
  body[data-v="splash"] .tile {
    /* the render window's size, not the final one — build-icons.sh shoots this
       at 1366 and scales up, and a tile bigger than the window puts the mark
       off centre in the part that gets captured */
    width: 1366px; height: 1366px;
    background: #eeebfa;
    border-radius: 0;
  }
  body[data-v="splash"] .gauge { width: 260px; height: 260px; color: #6d4ef6; }

  body[data-v="og"] { background: #eeebfa; }
  body[data-v="og"] .tile {
    width: 1200px; height: 630px;
    grid-auto-flow: column;
    gap: 4.5rem;
    place-content: center;
    padding: 0 5rem;
  }
  body[data-v="og"] .gauge { width: 300px; height: 300px; }

  .words { font: 400 1rem/1.25 "Fredoka", ui-rounded, "SF Pro Rounded", "Avenir Next", sans-serif; color: #fff; }
  .words h1 { font-size: 5.4rem; font-weight: 600; letter-spacing: -0.02em; }
  .words p { font-size: 2.1rem; margin-top: 1.1rem; opacity: 0.86; max-width: 22ch; }
</style>
</head>
<body>
  <div class="tile">
    <!-- Duet, engraved: two slurs turned toward each other, meeting on the
         note they agree about. One of them is you and one is the thing
         listening. They used to be plain arcs of even width; drawn as slurs —
         a crescent, thick in the middle and tapering to a point at each end,
         the way an engraver draws one — and with a tilted notehead in place of
         the dot, the same mark reads as music rather than as parentheses.
         "minimal like apple's own and the same type of idea as the old logo
         with it helping you, but make it more music looking." -->
    <svg class="gauge" viewBox="0 0 300 300" width="512" height="512" aria-hidden="true">
      <path d="M112 46 A108 108 0 0 0 112 254 A146 146 0 0 1 112 46Z" fill="currentColor" />
      <path d="M188 46 A108 108 0 0 1 188 254 A146 146 0 0 0 188 46Z" fill="currentColor" fill-opacity="0.5" />
      <ellipse cx="150" cy="150" rx="30" ry="21" fill="#17b578" transform="rotate(-22 150 150)" />
    </svg>
    <div class="words" hidden>
      <h1>Stand Partner</h1>
      <p>It listens while you play.</p>
    </div>
  </div>
<script>
  const v = new URLSearchParams(location.search).get('v') ?? 'icon';
  document.body.dataset.v = v;
  const tile = document.querySelector('.tile');
  if (v === 'og') {
    document.querySelector('.words').hidden = false;
  } else if (v !== 'splash') {
    // splash sizes itself in CSS; the icons are a fixed 512 square
    tile.style.width = tile.style.height = '512px';
  }
</script>
</body>
</html>
